name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        run: |
          APP_VERSION="$(cut -d+ -f1 VERSION)"
          EXPECTED_TAG="v${APP_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION (${EXPECTED_TAG})"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Materialize Cashbook app
        run: bash scripts/materialize-upstream.sh

      - name: Install dependencies
        working-directory: .worktree/BeeCount
        run: flutter pub get

      - name: Run privacy audit
        run: bash scripts/privacy-audit.sh

      - name: Restore stable release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > .worktree/BeeCount/android/app/cashbook-release.jks
          chmod 600 .worktree/BeeCount/android/app/cashbook-release.jks

          cat > .worktree/BeeCount/android/key.properties <<EOF
          storeFile=cashbook-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          chmod 600 .worktree/BeeCount/android/key.properties

      - name: Analyze Cashbook integration
        working-directory: .worktree/BeeCount
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/services/automation/cashbook_notification_capture_service.dart lib/pages/automation/cashbook_notification_billing_page.dart lib/pages/automation/auto_billing_settings_page.dart lib/main.dart

      - name: Build Android arm64 APK
        working-directory: .worktree/BeeCount
        run: flutter build apk --flavor prod --release --target-platform android-arm64

      - name: Collect APK
        run: |
          mkdir -p dist
          APK="$(find .worktree/BeeCount/build/app/outputs/flutter-apk -type f -name '*arm64*v8a*release*.apk' | head -n 1)"
          if [ -z "${APK}" ]; then
            APK="$(find .worktree/BeeCount/build/app/outputs/flutter-apk -type f -name '*release*.apk' | head -n 1)"
          fi
          test -n "${APK}"
          cp "${APK}" "dist/Cashbook-${GITHUB_REF_NAME}-arm64.apk"
          sha256sum "dist/Cashbook-${GITHUB_REF_NAME}-arm64.apk" > "dist/Cashbook-${GITHUB_REF_NAME}-arm64.apk.sha256"

      - name: Remove signing material
        if: always()
        run: |
          rm -f .worktree/BeeCount/android/app/cashbook-release.jks
          rm -f .worktree/BeeCount/android/key.properties

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            dist/Cashbook-${{ github.ref_name }}-arm64.apk
            dist/Cashbook-${{ github.ref_name }}-arm64.apk.sha256
