name: Foundation CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell-script-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          bash -n scripts/server-init.sh
          bash -n scripts/materialize-upstream.sh
          bash -n scripts/privacy-audit.sh
          bash -n scripts/backup.sh
          bash -n scripts/restore.sh
          bash -n tests/server_backup_restore_smoke.sh
      - name: Run backup and restore smoke tests
        run: bash tests/server_backup_restore_smoke.sh

  privacy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run privacy audit
        run: bash scripts/privacy-audit.sh

  android-capture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run capture unit tests
        run: gradle -p prototype/android-capture test --no-daemon

  upstream-overlay-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize pinned upstreams and apply Cashbook overlay
        run: bash scripts/materialize-upstream.sh
      - name: Verify notification bridge injection
        run: |
          grep -q 'CashbookNotificationBridge.register(' .worktree/BeeCount/android/app/src/main/kotlin/com/tntlikely/beecount/MainActivity.kt
          grep -q 'android:name=".CashbookNotificationCaptureService"' .worktree/BeeCount/android/app/src/main/AndroidManifest.xml
          test -f .worktree/BeeCount/android/app/src/main/kotlin/com/tntlikely/beecount/CashbookNotificationCaptureService.kt
      - name: Verify Flutter candidate intake and review UI
        run: |
          grep -q "cashbook_notification_capture_service.dart" .worktree/BeeCount/lib/main.dart
          grep -q 'CashbookNotificationCaptureService(container).initialize()' .worktree/BeeCount/lib/main.dart
          test -f .worktree/BeeCount/lib/services/automation/cashbook_notification_capture_service.dart
          grep -q 'return const CashbookNotificationBillingPage();' .worktree/BeeCount/lib/pages/automation/auto_billing_settings_page.dart
          test -f .worktree/BeeCount/lib/pages/automation/cashbook_notification_billing_page.dart
      - name: Verify privacy reductions
        run: |
          ! grep -q 'android.permission.READ_MEDIA_IMAGES' .worktree/BeeCount/android/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' .worktree/BeeCount/android/app/src/main/AndroidManifest.xml
          ! grep -q 'await _restoreScreenshotMonitor(container);' .worktree/BeeCount/lib/main.dart

  flutter-overlay-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - name: Materialize Cashbook app
        run: bash scripts/materialize-upstream.sh
      - name: Install Flutter dependencies
        working-directory: .worktree/BeeCount
        run: flutter pub get
      - name: Analyze Cashbook integration
        working-directory: .worktree/BeeCount
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/services/automation/cashbook_notification_capture_service.dart lib/pages/automation/cashbook_notification_billing_page.dart lib/pages/automation/auto_billing_settings_page.dart lib/main.dart

  android-apk-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - privacy-audit
      - android-capture-tests
      - upstream-overlay-check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - name: Materialize Cashbook app
        run: bash scripts/materialize-upstream.sh
      - name: Install dependencies
        working-directory: .worktree/BeeCount
        run: flutter pub get
      - name: Build Android release APK
        working-directory: .worktree/BeeCount
        run: flutter build apk --flavor prod --release --target-platform android-arm64
      - name: Collect and audit final APK
        run: |
          mkdir -p dist
          find .worktree/BeeCount/build/app/outputs/flutter-apk -type f -name '*.apk' -print
          APK="$(find .worktree/BeeCount/build/app/outputs/flutter-apk -type f -name '*arm64*v8a*release*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find .worktree/BeeCount/build/app/outputs/flutter-apk -type f -name '*release*.apk' | head -n 1)"
          fi
          test -n "$APK"
          cp "$APK" dist/Cashbook-v0.1.0-alpha-arm64.apk

          APK_ANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer 2>/dev/null | head -n 1)"
          if [ -z "$APK_ANALYZER" ]; then
            echo "::error::apkanalyzer not found under ANDROID_HOME"
            exit 1
          fi

          APP_ID="$("$APK_ANALYZER" manifest application-id dist/Cashbook-v0.1.0-alpha-arm64.apk)"
          test "$APP_ID" = "com.liushujie.cashbook"

          "$APK_ANALYZER" manifest print dist/Cashbook-v0.1.0-alpha-arm64.apk > dist/AndroidManifest-final.xml

          grep -q 'com.tntlikely.beecount.CashbookNotificationCaptureService' dist/AndroidManifest-final.xml
          grep -q 'android.permission.BIND_NOTIFICATION_LISTENER_SERVICE' dist/AndroidManifest-final.xml

          FORBIDDEN_PERMISSIONS=(
            android.permission.READ_SMS
            android.permission.RECEIVE_SMS
            android.permission.SEND_SMS
            android.permission.RECORD_AUDIO
            android.permission.READ_MEDIA_IMAGES
            android.permission.READ_MEDIA_VIDEO
            android.permission.READ_MEDIA_AUDIO
            android.permission.READ_EXTERNAL_STORAGE
            android.permission.WRITE_EXTERNAL_STORAGE
            android.permission.REQUEST_INSTALL_PACKAGES
          )

          for permission in "${FORBIDDEN_PERMISSIONS[@]}"; do
            if grep -q "android:name=\"${permission}\"" dist/AndroidManifest-final.xml; then
              echo "::error::Forbidden permission present in final APK: ${permission}"
              exit 1
            fi
          done

          sha256sum dist/Cashbook-v0.1.0-alpha-arm64.apk > dist/Cashbook-v0.1.0-alpha-arm64.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: cashbook-v0.1.0-alpha-arm64
          path: dist/Cashbook-v0.1.0-alpha-arm64.apk
          if-no-files-found: error
          retention-days: 14
